name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Cache Android SDK / NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-*
          key: android-sdk-ndk-${{ runner.os }}-v1

      - name: Cache debug keystore (서명 일관성 유지)
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore-v1

      # buildozer 이미지/p4a 는 구형 SDK 레이아웃(tools/bin/sdkmanager)을 요구한다.
      # 형제 저장소(lotto)에서 이미 검증된 SDK 캐시를 그대로 가져와 해결한다.
      - name: Restore verified Android SDK from sibling repository
        run: |
          set -e
          TOKEN="${{ secrets.SDK_TOKEN }}"
          SRC_REPO="ver9118-droid/lotto645-android"
          PLATFORM="$HOME/.buildozer/android/platform"
          SDK="$PLATFORM/android-sdk"
          mkdir -p "$PLATFORM" "$SDK/tools/bin" "$SDK/licenses"
          CID=$(curl -fsSL -H "Authorization: Bearer $TOKEN" \
                "https://api.github.com/repos/$SRC_REPO/actions/caches?key=android-sdk-ndk-Linux-v1" \
                | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['actions_caches'][0]['id'] if d.get('actions_caches') else '')")
          if [ -n "$CID" ]; then
            curl -fsSL -H "Authorization: Bearer $TOKEN" \
              "https://api.github.com/repos/$SRC_REPO/actions/caches/$CID/archive" -o /tmp/sdk.tar.gz
            tar -xzf /tmp/sdk.tar.gz -C "$PLATFORM"
            echo "SDK 캐시 복원 완료"
          else
            echo "캐시 없음 - 직접 설치"
          fi
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL -o /tmp/ct.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            python3 -m zipfile -e /tmp/ct.zip "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"
          L="$SDK/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$L/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd' > "$L/android-sdk-preview-license"
          printf '\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a' > "$L/android-googletv-license"
          printf '\nd975f751698a77b662f1254ddbeed3901e976f5a' > "$L/intel-android-extra-license"
          ls -l "$SDK/tools/bin/sdkmanager" || true

      - name: Build with buildozer (official docker image)
        run: |
          mkdir -p "$HOME/.buildozer" "$HOME/.android"
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            -v "$HOME/.android":/home/user/.android \
            ghcr.io/kivy/buildozer:latest android debug

      - name: Show result
        run: ls -lh bin/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: infiniteplayer-apk
          path: bin/*.apk
          if-no-files-found: error
